name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install
      working-directory: ./404islands-app

    - name: Build Docker images
      run: docker-compose build
      working-directory: .

    - name: Run tests
      run: npm test
      working-directory: ./404islands-app
      continue-on-error: true # Allow pipeline to continue even if tests fail for now

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to OCI
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        OCI_HOST: ${{ secrets.OCI_HOST }}
        OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      run: |
        echo "Deploying to OCI..."
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $OCI_USERNAME@$OCI_HOST "
          sudo systemctl start docker || true
          cd 404islands
          docker-compose pull
          docker-compose up -d --build
        "
        echo "Deployment to OCI complete."
#===========================================
# ARCHIPELAGO DOCKER COMPOSE CONFIGURATION
#===========================================
# Production-ready multi-container deployment
# Nginx + Node.js + Oracle Database integration

version: '3.8'

services:

  #===========================================
  # NGINX REVERSE PROXY
  #===========================================
  nginx:
    image: nginx:alpine
    container_name: archipelago-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl:ro
      - ./client/build:/var/www/archipelago/html:ro
      - ./logs/nginx:/var/log/nginx

    depends_on:
      - app

    networks:
      - archipelago-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  #===========================================
  # NODE.JS APPLICATION SERVER
  #===========================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: archipelago-app
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SSL_CERT_PATH=/etc/ssl/certs/archipelago.crt
      - SSL_KEY_PATH=/etc/ssl/private/archipelago.key

    volumes:
      - ./ssl:/etc/ssl/certs:ro
      - ./logs/app:/var/log/archipelago

    depends_on:
      - db

    networks:
      - archipelago-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  #===========================================
  # ORACLE AUTONOMOUS JSON DATABASE
  #===========================================
  db:
    image: container-registry.oracle.com/database/enterprise:latest
    container_name: archipelago-db
    restart: unless-stopped

    environment:
      - ORACLE_SID=ARCHPDB
      - ORACLE_PDB=ARCHPDB
      - ORACLE_PWD=${ORACLE_PASSWORD}
      - INIT_SGA_SIZE=2048
      - INIT_PGA_SIZE=512

    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./config/oracle:/opt/oracle/scripts/setup
      - ./db/backup:/opt/oracle/backup
      - ./logs/db:/opt/oracle/diag/rdbms

    ports:
      - "1521:1521"
      - "5500:5500"

    networks:
      - archipelago-network

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

  #===========================================
  # REDIS CACHE (Optional - for high performance)
  #===========================================
  redis:
    image: redis:7-alpine
    container_name: archipelago-redis
    restart: unless-stopped

    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    networks:
      - archipelago-network

  #===========================================
  # MONITORING WITH PROMETHEUS
  #===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: archipelago-prometheus
    restart: unless-stopped

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

    ports:
      - "9090:9090"

    networks:
      - archipelago-network

  #===========================================
  # LOGGING WITH GRAFANA
  #===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: archipelago-grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false

    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

    networks:
      - archipelago-network

#===========================================
# NETWORKS
#===========================================
networks:
  archipelago-network:
    driver: bridge

#===========================================
# VOLUMES
#===========================================
volumes:
  oracle_data:
  redis_data:
  prometheus_data:
  grafana_data:
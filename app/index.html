<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 Islands — a living atlas of the ocean</title>

  <meta name="description" content="Four hundred and four islands that do not exist, anchored to four hundred and four coordinates that do — each one lit and weathered by the conditions actually reported there, right now.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070a">

  <meta property="og:type" content="website">
  <meta property="og:title" content="404 Islands — a living atlas of the ocean">
  <meta property="og:description" content="404 procedurally generated islands, each anchored to a real coordinate and rendered under its real, live weather.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Installed to a phone or a wall display, the piece should be the whole
       screen and nothing else. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/views.css">

  <!-- The renderer is the first thing anyone sees; start fetching it with the
       document rather than after the stylesheets resolve. -->
  <link rel="modulepreload" href="/src/main.js">
  <link rel="modulepreload" href="/src/core/catalog.js">
  <link rel="modulepreload" href="/src/gl/renderer.js">
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
</head>
<body>
  <div id="app"></div>

  <noscript>
    <div style="padding:6rem 2rem;max-width:60ch;margin:0 auto;font-family:Georgia,serif;line-height:1.6">
      <h1 style="font-size:3rem;margin:0 0 1rem">404 Islands</h1>
      <p>This is a live rendering of four hundred and four islands, each drawn from
      fractal mathematics and lit by the weather currently reported at a real
      coordinate in the world ocean.</p>
      <p>It needs JavaScript and WebGL 2 to draw anything at all. There is no
      static version, because there is nothing static about it.</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

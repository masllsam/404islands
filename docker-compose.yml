services:
  atlas:
    build: .
    image: 404islands:latest
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # How long a climate response is reused before it is refetched. Ten
      # minutes is well inside Open-Meteo's own update cadence and keeps this
      # deployment a polite consumer of a free service.
      CLIMATE_TTL_MS: '600000'
      UPSTREAM_TIMEOUT_MS: '12000'
    volumes:
      - reservations:/data

volumes:
  reservations:

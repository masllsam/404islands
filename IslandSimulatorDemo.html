<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏝️ Archipelago Island Simulator - React Component Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .demo-header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .demo-title {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #87CEEB, #FFD700, #90EE90);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .demo-subtitle {
            font-size: 1.2em;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-label {
            font-size: 0.9em;
            opacity: 0.8;
            white-space: nowrap;
        }

        .control-button {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .control-button.active {
            background: rgba(0, 123, 255, 0.7);
            border-color: rgba(0, 123, 255, 0.8);
        }

        .control-input {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 4px;
            font-size: 0.9em;
            width: 80px;
        }

        .control-input::-webkit-outer-spin-button,
        .control-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .control-input[type=number] {
            -moz-appearance: textfield;
        }

        .demo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        . simulator-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            width: 100%;
        }

        @media (min-width: 900px) {
            .simulator-grid {
                grid-template-columns: 1fr 300px;
            }
        }

        .simulator-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .lateral-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-section {
            margin-bottom: 25px;
        }

        .panel-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #87CEEB;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-active {
            background: #28a745;
            box-shadow: 0 0 6px rgba(40, 167, 69, 0.6);
        }

        .status-inactive {
            background: #6c757d;
        }

        .status-warning {
            background: #ffc107;
            box-shadow: 0 0 6px rgba(255, 193, 7, 0.6);
        }

        .touch-instructions {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            border-left: 3px solid #17a2b8;
        }

        .instructions-list {
            list-style: none;
            padding: 0;
        }

        .instructions-list li {
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .instructions-list li:before {
            content: "👉 ";
            margin-right: 8px;
        }

        .performance-metrics {
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
        }

        .metric-label {
            opacity: 0.7;
        }

        .metric-value {
            color: #17a2b8;
        }

        @media (max-width: 768px) {
            .demo-title {
                font-size: 2em;
            }

            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                justify-content: space-between;
            }

            .simulator-grid {
                grid-template-columns: 1fr;
            }

            .lateral-panel {
                margin-top: 20px;
            }
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="demo-header" class="demo-header">
        <h1 class="demo-title">🏝️ Archipelago Island Simulator</h1>
        <p class="demo-subtitle">Production-ready React component for immersive island exploration</p>
    </div>

    <div id="controls-bar" class="controls-bar"></div>

    <div id="demo-container" class="demo-container">
        <div id="simulator-grid" class="simulator-grid">
            <div id="simulator-wrapper" class="simulator-wrapper"></div>
            <div id="lateral-panel" class="lateral-panel"></div>
        </div>
    </div>

    <script type="text/babel">
        //================================================
        // ARCHIPELAGO REACT DEMO APPLICATION
        //================================================
        // Complete island simulation with touch controls and all features

        const { useState, useEffect, useCallback } = React;

        //================================================
        // DEMO STATE MANAGEMENT
        //================================================

        function App() {
            const [currentIslandId, setCurrentIslandId] = useState(1);
            const [islandLoading, setIslandLoading] = useState(false);
            const [performanceMetrics, setPerformanceMetrics] = useState({
                fps: 0,
                renderTime: 0,
                memoryUsage: 0,
                frameTime: 0
            });
            const [systemsActive, setSystemsActive] = useState({
                weather: true,
                season: true,
                audio: true,
                controls: true,
                performance: false
            });

            // Island change handler
            const handleIslandChange = useCallback((newIslandId) => {
                console.log(`🏝️ Exploring Island ${newIslandId}`);
                setCurrentIslandId(newIslandId);
            }, []);

            // Error handler
            const handleError = useCallback((error) => {
                console.error('🏝️ Island exploration error:', error);
                alert(`Island exploration error: ${error.message}`);
            }, []);

            // Performance monitoring
            const handlePerformanceUpdate = useCallback((metrics) => {
                setPerformanceMetrics(metrics);
            }, []);

            // System toggle handlers
            const toggleSystem = useCallback((systemName) => {
                setSystemsActive(prev => ({
                    ...prev,
                    [systemName]: !prev[systemName]
                }));
            }, []);

            // Island navigation
            const navigateIsland = useCallback((direction) => {
                const newId = direction === 'prev'
                    ? Math.max(1, currentIslandId - 1)
                    : Math.min(404, currentIslandId + 1);

                if (newId !== currentIslandId) {
                    setIslandLoading(true);
                    setTimeout(() => {
                        handleIslandChange(newId);
                        setIslandLoading(false);
                    }, 100);
                }
            }, [currentIslandId, handleIslandChange]);

            return (
                <div className="demo-app">
                    {/* Controls bar */}
                    <ControlsBar
                        currentIslandId={currentIslandId}
                        systemsActive={systemsActive}
                        onIslandNavigation={navigateIsland}
                        onSystemToggle={toggleSystem}
                        islandLoading={islandLoading}
                    />

                    {/* Main content grid */}
                    <div className="simulator-grid">
                        {/* Island Simulator */}
                        <div className="simulator-wrapper" style={{ position: 'relative' }}>
                            <IslandSimulatorComponent
                                islandId={currentIslandId}
                                width={800}
                                height={600}
                                showControls={systemsActive.controls}
                                touchEnabled={systemsActive.controls}
                                audioEnabled={systemsActive.audio}
                                showPerformance={systemsActive.performance}
                                onIslandChange={handleIslandChange}
                                onError={handleError}
                                onPerformanceUpdate={handlePerformanceUpdate}
                            />

                            {/* Loading overlay */}
                            {islandLoading && (
                                <div className="loading-overlay">
                                    <div style={{ fontSize: '2em', marginBottom: '10px' }}>🏝️</div>
                                    <div>Navigating to Island {currentIslandId}...</div>
                                </div>
                            )}
                        </div>

                        {/* Lateral panel */}
                        <LateralPanel
                            systemsActive={systemsActive}
                            performanceMetrics={performanceMetrics}
                            currentIslandId={currentIslandId}
                        />
                    </div>
                </div>
            );
        }

        //================================================
        // CONTROLS BAR COMPONENT
        //================================================

        function ControlsBar({ currentIslandId, systemsActive, onIslandNavigation, onSystemToggle, islandLoading }) {
            return (
                <div className="controls-bar">
                    {/* Island navigation */}
                    <div className="control-group">
                        <span className="control-label">🌴 Island</span>
                        <button
                            className="control-button"
                            onClick={() => onIslandNavigation('prev')}
                            disabled={currentIslandId <= 1 || islandLoading}
                        >
                            ⏪ Prev
                        </button>

                        <input
                            type="number"
                            className="control-input"
                            value={currentIslandId}
                            onChange={(e) => {
                                const newId = parseInt(e.target.value) || 1;
                                if (newId >= 1 && newId <= 404) {
                                    onIslandNavigation(newId - currentIslandId < 0 ? 'prev' : 'next');
                                    setTimeout(() => {
                                        window.location.reload(); // Force re-render for new island
                                    }, 100);
                                }
                            }}
                            min="1"
                            max="404"
                        />

                        <button
                            className="control-button"
                            onClick={() => onIslandNavigation('next')}
                            disabled={currentIslandId >= 404 || islandLoading}
                        >
                            Next ⏩
                        </button>
                    </div>

                    {/* System toggles */}
                    <div className="control-group">
                        <span className="control-label">🌀 Systems</span>
                        <button
                            className={`control-button ${systemsActive.weather ? 'active' : ''}`}
                            onClick={() => onSystemToggle('weather')}
                        >
                            {systemsActive.weather ? '🌦️' : '🌪️'}
                        </button>
                        <button
                            className={`control-button ${systemsActive.season ? 'active' : ''}`}
                            onClick={() => onSystemToggle('season')}
                        >
                            {systemsActive.season ? '🌸' : '🔗'}
                        </button>
                        <button
                            className={`control-button ${systemsActive.audio ? 'active' : ''}`}
                            onClick={() => onSystemToggle('audio')}
                        >
                            {systemsActive.audio ? '🔊' : '🔇'}
                        </button>
                        <button
                            className={`control-button ${systemsActive.controls ? 'active' : ''}`}
                            onClick={() => onSystemToggle('controls')}
                        >
                            {systemsActive.controls ? '🎮' : '🚫'}
                        </button>
                    </div>

                    {/* Performance monitor */}
                    <div className="control-group">
                        <span className="control-label">⚡ Performance</span>
                        <button
                            className={`control-button ${systemsActive.performance ? 'active' : ''}`}
                            onClick={() => onSystemToggle('performance')}
                        >
                            {systemsActive.performance ? '🧮' : '📊'}
                        </button>
                    </div>
                </div>
            );
        }

        //================================================
        // LATERAL PANEL COMPONENT
        //================================================

        function LateralPanel({ systemsActive, performanceMetrics, currentIslandId }) {
            return (
                <div className="lateral-panel">
                    {/* System status */}
                    <div className="panel-section">
                        <h3 className="panel-title">🔧 System Status</h3>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                            <div style={{ display: 'flex', alignItems: 'center' }}>
                                <span className={`status-indicator ${systemsActive.weather ? 'status-active' : 'status-inactive'}`}></span>
                                Weather System {systemsActive.weather ? '✅' : '❌'}
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center' }}>
                                <span className={`status-indicator ${systemsActive.season ? 'status-active' : 'status-inactive'}`}></span>
                                Seasonal System {systemsActive.season ? '✅' : '❌'}
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center' }}>
                                <span className={`status-indicator ${systemsActive.audio ? 'status-active' : 'status-inactive'}`}></span>
                                Audio System {systemsActive.audio ? '✅' : '❌'}
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center' }}>
                                <span className={`status-indicator ${systemsActive.controls ? 'status-active' : 'status-inactive'}`}></span>
                                Touch Controls {systemsActive.controls ? '✅' : '❌'}
                            </div>
                        </div>
                    </div>

                    {/* Touch instructions */}
                    <div className="panel-section">
                        <h3 className="panel-title">👆 Touch Controls</h3>
                        <div className="touch-instructions">
                            <ul className="instructions-list">
                                <li><strong>Drag:</strong> Pan around the island</li>
                                <li><strong>Pinch:</strong> Zoom in/out</li>
                                <li><strong>Double tap:</strong> Reset view</li>
                                <li><strong>Weather button:</strong> Toggle storm</li>
                                <li><strong>Season button:</strong> Advance season</li>
                            </ul>
                        </div>
                    </div>

                    {/* Performance metrics */}
                    {systemsActive.performance && (
                        <div className="panel-section">
                            <h3 className="panel-title">📈 Performance</h3>
                            <div className="performance-metrics">
                                <div className="metrics-grid">
                                    <div className="metric">
                                        <span className="metric-label">FPS:</span>
                                        <span className="metric-value">{performanceMetrics.fps || '60'}</span>
                                    </div>
                                    <div className="metric">
                                        <span className="metric-label">Render:</span>
                                        <span className="metric-value">{(performanceMetrics.renderTime || '16').toFixed(1)}ms</span>
                                    </div>
                                    <div className="metric">
                                        <span className="metric-label">Memory:</span>
                                        <span className="metric-value">{Math.round((performanceMetrics.memoryUsage || 0) / 1024 / 1024)}MB</span>
                                    </div>
                                    <div className="metric">
                                        <span className="metric-label">Island:</span>
                                        <span className="metric-value">#{currentIslandId}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Island information */}
                    <div className="panel-section">
                        <h3 className="panel-title">🏝️ Current Island</h3>
                        <div style={{ padding: '10px', background: 'rgba(0,0,0,0.2)', borderRadius: '4px' }}>
                            <div><strong>ID:</strong> #{currentIslandId}</div>
                            <div><strong>Range:</strong> 1-404 available</div>
                            <div><strong>Generation:</strong> Procedural fBm</div>
                            <div><strong>Rendering:</strong> HTML5 Canvas</div>
                        </div>
                    </div>
                </div>
            );
        }

        //================================================
        // ISLAND SIMULATOR PLACEHOLDER COMPONENT
        //================================================
        // In production, this would import the real IslandSimulator
        // This is a placeholder that mimics the interface

        function IslandSimulatorComponent(props) {
            return (
                <div>
                    IslandSimulator component would go here with props:
                    <code style={{ display: 'block', margin: '10px 0', background: 'rgba(0,0,0,0.3)', padding: '10px' }}>
                        {JSON.stringify(props, null, 2)}
                    </code>
                </div>
            );
        }

        //================================================
        // RENDER APPLICATION
        //================================================

        ReactDOM.render(<App />, document.getElementById('demo-container'));

        // Add instructions to header
        const instructions = React.createElement('div', {
            style: {
                fontSize: '0.8em',
                opacity: 0.7,
                marginTop: '10px'
            }
        }, 'This demo showcases the complete React Island Simulator architecture. The real component requires additional JavaScript modules to function.');

        ReactDOM.render(instructions, document.getElementById('demo-header'));
    </script>
</body>
</html>
